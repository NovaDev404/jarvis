<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Voice Assistant</title>
    <style>
      body {
        background-color: #000;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      #loadingVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1000;
        display: none;
      }

      #beginBtn {
        background: #0066ff;
        color: white;
        border: none;
        padding: 20px 60px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 8px;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s ease;
        z-index: 10;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #beginBtn:hover {
        background: #0088ff;
        box-shadow: 0 0 30px rgba(0, 102, 255, 0.5);
      }

      #beginBtn:disabled {
        background: #333;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      #status {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        color: #00aaff;
        z-index: 10;
        text-align: center;
      }

      #orbContainer {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
      }

      /* =========================================
         ORB CONTAINER
         ========================================= */

      .siri-orb-container {
        position: relative;
        width: 200px;
        height: 200px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
        border-radius: 50%;
        overflow: hidden;

        transform-origin: center center;
        transition: transform 0.1s ease-out;

        box-shadow:
          0 0 40px rgba(0, 150, 255, 0.4),
          0 0 80px rgba(0, 100, 255, 0.3),
          0 0 120px rgba(0, 50, 255, 0.2);
      }


      /* =========================================
         MAIN ORB
         ========================================= */

      .siri-orb {
        position: relative;

        width: 100%;
        height: 100%;

        border-radius: 50%;

        filter: blur(10px);

        animation: orb-pulse 7s ease-in-out infinite alternate;
      }


      /* =========================================
         FLUID LAYERS
         ========================================= */

      .siri-orb::before,
      .siri-orb::after {
        content: "";

        position: absolute;

        inset: -35%;

        width: 170%;
        height: 170%;

        border-radius: 50%;

        mix-blend-mode: screen;
      }


      /* =========================================
         PRIMARY FLUID LAYER
         ========================================= */

      .siri-orb::before {
        background:
          radial-gradient(
            ellipse 45% 65% at 20% 30%,
            #00ffff 0%,
            #00bfff 25%,
            transparent 65%
          ),

          radial-gradient(
            ellipse 60% 45% at 80% 25%,
            #008cff 0%,
            #0055ff 30%,
            transparent 70%
          ),

          radial-gradient(
            ellipse 45% 60% at 70% 80%,
            #00e5ff 0%,
            #0077ff 35%,
            transparent 70%
          ),

          radial-gradient(
            ellipse 50% 50% at 25% 80%,
            #004cff 0%,
            #001f88 40%,
            transparent 70%
          ),

          #00143a;

        animation:
          fluid-primary 12s ease-in-out infinite alternate;
      }


      /* =========================================
         SECONDARY FLUID LAYER
         ========================================= */

      .siri-orb::after {
        background:
          radial-gradient(
            ellipse 50% 40% at 75% 20%,
            #ffffff 0%,
            #00eaff 20%,
            transparent 65%
          ),

          radial-gradient(
            ellipse 55% 60% at 15% 65%,
            #00aaff 0%,
            #0066ff 35%,
            transparent 70%
          ),

          radial-gradient(
            ellipse 50% 45% at 85% 75%,
            #00ffff 0%,
            #008cff 35%,
            transparent 70%
          ),

          radial-gradient(
            ellipse 40% 55% at 45% 45%,
            #0066ff 0%,
            #002b99 40%,
            transparent 70%
          );

        opacity: 0.85;

        animation:
          fluid-secondary 16s ease-in-out infinite alternate;
      }


      /* =========================================
         PRIMARY FLOW
         ========================================= */

      @keyframes fluid-primary {

        0% {
          transform:
            translate(-18%, -10%)
            scale(0.95)
            rotate(-8deg);
        }

        25% {
          transform:
            translate(12%, -20%)
            scale(1.15)
            rotate(5deg);
        }

        50% {
          transform:
            translate(20%, 12%)
            scale(1.05)
            rotate(12deg);
        }

        75% {
          transform:
            translate(-12%, 20%)
            scale(1.2)
            rotate(-4deg);
        }

        100% {
          transform:
            translate(-20%, -5%)
            scale(0.98)
            rotate(-12deg);
        }

      }


      /* =========================================
         SECONDARY FLOW
         ========================================= */

      @keyframes fluid-secondary {

        0% {
          transform:
            translate(20%, 15%)
            scale(0.9)
            rotate(10deg);
        }

        25% {
          transform:
            translate(-15%, 5%)
            scale(1.2)
            rotate(-8deg);
        }

        50% {
          transform:
            translate(-20%, -20%)
            scale(1.05)
            rotate(-15deg);
        }

        75% {
          transform:
            translate(15%, -10%)
            scale(1.18)
            rotate(6deg);
        }

        100% {
          transform:
            translate(18%, 18%)
            scale(0.95)
            rotate(15deg);
        }

      }


      /* =========================================
         ORB PULSE
         ========================================= */

      @keyframes orb-pulse {

        0% {
          transform: scale(0.96);

          filter:
            blur(10px)
            brightness(0.90);
        }

        50% {
          transform: scale(1.01);

          filter:
            blur(10px)
            brightness(1.05);
        }

        100% {
          transform: scale(1.04);

          filter:
            blur(10px)
            brightness(1.00);
        }

      }


      /* =========================================
         OUTER JARVIS GLOW
         ========================================= */

      .siri-orb-container::after {
        content: "";

        position: absolute;

        inset: -25px;

        border-radius: 50%;

        pointer-events: none;

        box-shadow:
          0 0 20px rgba(0, 240, 255, 0.4),
          0 0 40px rgba(0, 180, 255, 0.3),
          0 0 80px rgba(0, 90, 255, 0.2);
      }


      /* =========================================
         REDUCED MOTION
         ========================================= */

      @media (prefers-reduced-motion: reduce) {

        .siri-orb,
        .siri-orb::before,
        .siri-orb::after {
          animation: none !important;
        }

      }
    </style>
  </head>
  <body>
    <video id="loadingVideo" playsinline>
      <source src="/static/jarvis_loading.mp4" type="video/mp4">
    </video>

    <div id="orbContainer">
      <div class="siri-orb-container">
        <div class="siri-orb"></div>
      </div>
    </div>

    <button id="beginBtn" onclick="beginSequence()">Begin</button>
    <div id="status">Ready</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
      let socket = null;
      let audioContext = null;
      let stream = null;
      let source = null;
      let workletNode = null;
      let muteGain = null;
      /*
       * ------------------------------------------------
       * TTS playback state
       * ------------------------------------------------
       */
      let ttsPlaying = false;
      let ttsSource = null;
      let ttsAnalyser = null;
      let orbAnimationId = null;
      /*
       * AudioWorklet processor.
       *
       * Receives microphone Float32 audio,
       * converts it to signed 16-bit PCM,
       * and sends it to the main page.
       */
      const workletCode = `

            class MicProcessor extends AudioWorkletProcessor {

                process(inputs) {

                    const input = inputs[0];

                    if (
                        !input ||
                        !input[0]
                    ) {
                        return true;
                    }

                    const samples = input[0];

                    const pcm =
                        new Int16Array(
                            samples.length
                        );

                    for (
                        let i = 0;
                        i < samples.length;
                        i++
                    ) {

                        let sample =
                            Math.max(
                                -1,
                                Math.min(
                                    1,
                                    samples[i]
                                )
                            );

                        pcm[i] =
                            sample < 0
                                ? sample * 0x8000
                                : sample * 0x7FFF;
                    }

                    this.port.postMessage(
                        pcm.buffer,
                        [pcm.buffer]
                    );

                    return true;
                }
            }

            registerProcessor(
                "jarvis-mic-processor",
                MicProcessor
            );

        `;
      /*
       * ------------------------------------------------
       * Convert incoming Socket.IO binary data
       * into an ArrayBuffer.
       * ------------------------------------------------
       */
      function getAudioArrayBuffer(data) {
        if (data instanceof ArrayBuffer) {
          return data;
        }
        if (ArrayBuffer.isView(data)) {
          return data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
        }
        if (data instanceof Blob) {
          return data.arrayBuffer();
        }
        return new Uint8Array(data).buffer;
      }

      /*
       * ------------------------------------------------
       * Pulse orb once for wake word detection
       * ------------------------------------------------
       */
      function pulseOrbOnce() {
        const container = document.querySelector(".siri-orb-container");
        if (!container) return;

        container.style.transition = "transform 0.3s ease-out";
        container.style.transform = "scale(1.3)";

        setTimeout(() => {
          container.style.transform = "scale(1.0)";
        }, 300);

        setTimeout(() => {
          container.style.transition = "transform 0.1s ease-out";
        }, 600);
      }

      /*
       * ------------------------------------------------
       * Animate orb based on audio volume
       * ------------------------------------------------
       */
      function animateOrbToAudio() {
        if (!ttsAnalyser || !ttsPlaying) {
          orbAnimationId = null;
          return;
        }

        const dataArray = new Uint8Array(ttsAnalyser.frequencyBinCount);
        ttsAnalyser.getByteFrequencyData(dataArray);

        // Calculate average volume
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const average = sum / dataArray.length;

        // Scale based on volume (normalize to 0.8-1.5 range)
        const scale = 0.8 + (average / 255) * 0.7;

        const container = document.querySelector(".siri-orb-container");
        if (container) {
          container.style.transform = `scale(${scale})`;
        }

        orbAnimationId = requestAnimationFrame(animateOrbToAudio);
      }

      /*
       * ------------------------------------------------
       * Stop audio-reactive animation
       * ------------------------------------------------
       */
      function stopOrbAnimation() {
        if (orbAnimationId) {
          cancelAnimationFrame(orbAnimationId);
          orbAnimationId = null;
        }
        const container = document.querySelector(".siri-orb-container");
        if (container) {
          container.style.transform = "";
        }
      }
      /*
       * ------------------------------------------------
       * Play TTS audio received from the server.
       *
       * The server sends the generated WAV file as
       * binary data using the "tts_audio" event.
       * ------------------------------------------------
       */
      async function playTTS(data) {
        if (!audioContext) {
          return;
        }
        ttsPlaying = true;
        const status = document.getElementById("status");
        status.textContent = " Speaking... ";
        try {
          /*
           * Make sure the AudioContext is running.
           */
          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }
          /*
           * Convert the incoming binary data
           * into an ArrayBuffer.
           */
          const audioData = await getAudioArrayBuffer(data);
          /*
           * Decode the WAV file.
           */
          const audioBuffer = await audioContext.decodeAudioData(audioData);
          /*
           * Stop any previous TTS playback.
           */
          if (ttsSource) {
            try {
              ttsSource.stop();
            } catch (_) {
              // Already stopped.
            }
            try {
              ttsSource.disconnect();
            } catch (_) {
              // Already disconnected.
            }
            ttsSource = null;
          }
          if (ttsAnalyser) {
            try {
              ttsAnalyser.disconnect();
            } catch (_) {
              // Already disconnected.
            }
            ttsAnalyser = null;
          }
          /*
           * Create analyser for audio-reactive orb
           */
          ttsAnalyser = audioContext.createAnalyser();
          ttsAnalyser.fftSize = 256;
          /*
           * Create a new source for this response.
           */
          ttsSource = audioContext.createBufferSource();
          ttsSource.buffer = audioBuffer;
          /*
           * Connect: source -> analyser -> destination
           */
          ttsSource.connect(ttsAnalyser);
          ttsAnalyser.connect(audioContext.destination);
          /*
           * Start audio-reactive animation
           */
          animateOrbToAudio();
          /*
           * When playback finishes, allow
           * microphone transmission again.
           */
          ttsSource.onended = () => {
            if (ttsSource) {
              try {
                ttsSource.disconnect();
              } catch (_) {
                // Already disconnected.
              }
            }
            ttsSource = null;
            if (ttsAnalyser) {
              try {
                ttsAnalyser.disconnect();
              } catch (_) {
                // Already disconnected.
              }
              ttsAnalyser = null;
            }
            ttsPlaying = false;
            stopOrbAnimation();
            /*
             * Delay to ensure audio has finished playing
             * through the hardware buffer before notifying server.
             * Longer responses need more time for the audio to
             * fully clear the output buffer.
             */
            setTimeout(() => {
              if (socket && socket.connected) {
                socket.emit("tts_finished");
                status.textContent = " Listening... ";
              }
            }, 500);
          };
          /*
           * Start playing immediately.
           */
          ttsSource.start(0);
        } catch (error) {
          console.error("TTS playback error:", error);
          ttsPlaying = false;
          stopOrbAnimation();
          if (socket && socket.connected) {
            setTimeout(() => {
              socket.emit("tts_finished");
              status.textContent = " Listening... ";
            }, 500);
          }
        }
      }
      async function beginSequence() {
        const beginBtn = document.getElementById("beginBtn");
        const loadingVideo = document.getElementById("loadingVideo");
        const orbContainer = document.getElementById("orbContainer");
        const status = document.getElementById("status");

        beginBtn.style.display = "none";
        loadingVideo.style.display = "block";
        loadingVideo.currentTime = 0;
        await loadingVideo.play();

        loadingVideo.onended = () => {
          loadingVideo.style.display = "none";
          orbContainer.style.display = "block";
          startRecording();
        };
      }

      async function startRecording() {
        const status = document.getElementById("status");
        status.textContent = " Requesting microphone... ";
        try {
          /*
           * ------------------------------------------------
           * Microphone
           * ------------------------------------------------
           */
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: {
                ideal: 1
              },
              sampleRate: {
                ideal: 16000
              },
              sampleSize: {
                ideal: 16
              },
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          const track = stream.getAudioTracks()[0];
          if (!track) {
            throw new Error("No microphone audio track.");
          }
          /*
           * ------------------------------------------------
           * Socket.IO
           * ------------------------------------------------
           */
          socket = io();
          /*
           * ------------------------------------------------
           * Receive TTS audio from server.
           * ------------------------------------------------
           *
           * web_server.py sends:
           *
           * socketio.emit(
           *     "tts_audio",
           *     audio_bytes,
           *     to=sid
           * )
           *
           * The browser receives the WAV here
           * and immediately plays it.
           */
          socket.on("tts_audio",
            (data) => {
              playTTS(data);
            });
          socket.on("wake_word_detected",
            () => {
              pulseOrbOnce();
            });
          socket.on("conversation_start",
            () => {
              const status = document.getElementById("status");
              status.textContent = " Listening... ";
            });
          socket.on("conversation_end",
            () => {
              const status = document.getElementById("status");
              status.textContent = " Listening... ";
            });
          socket.on("connect", async () => {
            status.textContent = " Starting audio... ";
            /*
             * Request a 16 kHz audio context.
             */
            try {
              audioContext = new AudioContext({
                sampleRate: 16000
              });
            } catch (error) {
              audioContext = new AudioContext();
            }
            if (audioContext.state === "suspended") {
              await audioContext.resume();
            }
            /*
             * Tell Python the actual
             * AudioContext sample rate.
             */
            socket.emit("sample_rate", audioContext.sampleRate);
            /*
             * ------------------------------------------------
             * AudioWorklet
             * ------------------------------------------------
             */
            const blob = new Blob(
              [workletCode], {
                type: "application/javascript"
              });
            const workletUrl = URL.createObjectURL(blob);
            await audioContext.audioWorklet.addModule(workletUrl);
            URL.revokeObjectURL(workletUrl);
            /*
             * Microphone source.
             */
            source = audioContext.createMediaStreamSource(stream);
            /*
             * AudioWorklet node.
             */
            workletNode = new AudioWorkletNode(audioContext, "jarvis-mic-processor", {
              numberOfInputs: 1,
              numberOfOutputs: 1,
              channelCount: 1,
              channelCountMode: "explicit",
              channelInterpretation: "speakers"
            });
            /*
             * Receive converted PCM
             * from the worklet.
             */
            workletNode.port.onmessage = (event) => {
              /*
               * DO NOT send microphone
               * audio while Jarvis is speaking.
               *
               * This prevents the TTS audio from
               * being picked up and sent back into
               * STT / wake-word detection.
               */
              if (ttsPlaying) {
                return;
              }
              if (!socket || !socket.connected) {
                return;
              }
              socket.emit("audio_data", event.data);
            };
            /*
             * ------------------------------------------------
             * Zero-gain output
             * ------------------------------------------------
             *
             * The AudioWorklet needs to remain in the
             * audio graph, but we must NOT play the
             * microphone back through the speakers.
             */
            muteGain = audioContext.createGain();
            muteGain.gain.value = 0;
            /*
             * Audio graph:
             *
             * Microphone
             *      ↓
             * AudioWorklet
             *      ↓
             * Zero Gain
             *      ↓
             * Speakers
             *
             * Gain = 0, so nothing is audible.
             */
            source.connect(workletNode);
            workletNode.connect(muteGain);
            muteGain.connect(audioContext.destination);
            /*
             * Make sure the microphone track
             * is enabled.
             */
            track.enabled = true;
            status.textContent = " Listening... ";
            pulseOrbOnce();
          });
          socket.on("connect_error",
            (error) => {
              console.error("Socket.IO connection error:", error);
              status.textContent = " Connection error. ";
              stopRecording();
              const beginBtn = document.getElementById("beginBtn");
              const orbContainer = document.getElementById("orbContainer");
              if (beginBtn) {
                beginBtn.style.display = "block";
              }
              if (orbContainer) {
                orbContainer.style.display = "none";
              }
              status.style.display = "none";
            });
          socket.on("disconnect",
            () => {
              status.textContent = " Disconnected. ";
              const beginBtn = document.getElementById("beginBtn");
              if (beginBtn) {
                beginBtn.style.display = "block";
              }
            });
        } catch (error) {
          console.error("Microphone error:", error);
          status.textContent = " Microphone error: " + error.message;
          stopRecording();
        }
      }

      function stopRecording() {
        /*
         * Stop TTS playback.
         */
        ttsPlaying = false;
        stopOrbAnimation();
        if (ttsSource) {
          try {
            ttsSource.stop();
          } catch (_) {
            // Already stopped.
          }
          try {
            ttsSource.disconnect();
          } catch (_) {
            // Already disconnected.
          }
          ttsSource = null;
        }
        if (ttsAnalyser) {
          try {
            ttsAnalyser.disconnect();
          } catch (_) {
            // Already disconnected.
          }
          ttsAnalyser = null;
        }
        /*
         * AudioWorklet
         */
        if (workletNode) {
          try {
            workletNode.disconnect();
          } catch (_) {
            // Already disconnected.
          }
          workletNode = null;
        }
        /*
         * Zero-gain node
         */
        if (muteGain) {
          try {
            muteGain.disconnect();
          } catch (_) {
            // Already disconnected.
          }
          muteGain = null;
        }
        /*
         * Microphone source
         */
        if (source) {
          try {
            source.disconnect();
          } catch (_) {
            // Already disconnected.
          }
          source = null;
        }
        /*
         * AudioContext
         */
        if (audioContext) {
          try {
            audioContext.close();
          } catch (_) {
            // Already closed.
          }
          audioContext = null;
        }
        /*
         * Microphone stream
         */
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        /*
         * Socket.IO
         */
        if (socket) {
          socket.disconnect();
          socket = null;
        }
      }
    </script>
  </body>
</html>
