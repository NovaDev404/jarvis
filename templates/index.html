<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Voice Assistant</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
      }

      button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      #status {
        margin-top: 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Jarvis Voice Assistant</h1>
    <button id="startBtn" onclick="startRecording()"> Start Listening </button>
    <div id="status"> Ready </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
      let socket = null;
      let audioContext = null;
      let stream = null;
      let source = null;
      let workletNode = null;
      let muteGain = null;
      /*
       * AudioWorklet processor.
       *
       * Receives microphone Float32 audio,
       * converts it to signed 16-bit PCM,
       * and sends it to the main page.
       */
      const workletCode = `

            class MicProcessor extends AudioWorkletProcessor {

                process(inputs) {

                    const input = inputs[0];

                    if (
                        !input ||
                        !input[0]
                    ) {
                        return true;
                    }

                    const samples = input[0];

                    const pcm =
                        new Int16Array(
                            samples.length
                        );

                    for (
                        let i = 0;
                        i < samples.length;
                        i++
                    ) {

                        let sample =
                            Math.max(
                                -1,
                                Math.min(
                                    1,
                                    samples[i]
                                )
                            );

                        pcm[i] =
                            sample < 0
                                ? sample * 0x8000
                                : sample * 0x7FFF;
                    }

                    this.port.postMessage(
                        pcm.buffer,
                        [pcm.buffer]
                    );

                    return true;
                }
            }

            registerProcessor(
                "jarvis-mic-processor",
                MicProcessor
            );

        `;
      async function startRecording() {
        const startBtn = document.getElementById("startBtn");
        const status = document.getElementById("status");
        startBtn.disabled = true;
        status.textContent = "Requesting microphone...";
        try {
          /*
           * ------------------------------------------------
           * Microphone
           * ------------------------------------------------
           */
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: {
                ideal: 1
              },
              sampleRate: {
                ideal: 16000
              },
              sampleSize: {
                ideal: 16
              },
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
          const track = stream.getAudioTracks()[0];
          if (!track) {
            throw new Error("No microphone audio track.");
          }
          /*
           * ------------------------------------------------
           * Socket.IO
           * ------------------------------------------------
           */
          socket = io();
          socket.on("connect", async () => {
            status.textContent = "Starting audio...";
            /*
             * Request a 16 kHz audio context.
             */
            try {
              audioContext = new AudioContext({
                sampleRate: 16000
              });
            } catch (error) {
              audioContext = new AudioContext();
            }
            if (audioContext.state === "suspended") {
              await audioContext.resume();
            }
            /*
             * Tell Python the actual
             * AudioContext sample rate.
             */
            socket.emit("sample_rate", audioContext.sampleRate);
            /*
             * ------------------------------------------------
             * AudioWorklet
             * ------------------------------------------------
             */
            const blob = new Blob(
              [workletCode], {
                type: "application/javascript"
              });
            const workletUrl = URL.createObjectURL(blob);
            await audioContext.audioWorklet.addModule(workletUrl);
            URL.revokeObjectURL(workletUrl);
            /*
             * Microphone source.
             */
            source = audioContext.createMediaStreamSource(stream);
            /*
             * AudioWorklet node.
             */
            workletNode = new AudioWorkletNode(audioContext, "jarvis-mic-processor", {
              numberOfInputs: 1,
              numberOfOutputs: 1,
              channelCount: 1,
              channelCountMode: "explicit",
              channelInterpretation: "speakers"
            });
            /*
             * Receive converted PCM
             * from the worklet.
             */
            workletNode.port.onmessage = (event) => {
              if (!socket || !socket.connected) {
                return;
              }
              socket.emit("audio_data", event.data);
            };
            /*
             * ------------------------------------------------
             * Zero-gain output
             * ------------------------------------------------
             *
             * The AudioWorklet needs to remain in the
             * audio graph, but we must NOT play the
             * microphone back through the speakers.
             */
            muteGain = audioContext.createGain();
            muteGain.gain.value = 0;
            /*
             * Audio graph:
             *
             * Microphone
             *      ↓
             * AudioWorklet
             *      ↓
             * Zero Gain
             *      ↓
             * Speakers
             *
             * Gain = 0, so nothing is audible.
             */
            source.connect(workletNode);
            workletNode.connect(muteGain);
            muteGain.connect(audioContext.destination);
            /*
             * Make sure the microphone track
             * is enabled.
             */
            track.enabled = true;
            status.textContent = "Listening...";
          });
          socket.on("connect_error",
            (error) => {
              console.error("Socket.IO connection error:", error);
              status.textContent = "Connection error.";
              stopRecording();
              startBtn.disabled = false;
            });
          socket.on("disconnect",
            () => {
              status.textContent = "Disconnected.";
            });
        } catch (error) {
          console.error("Microphone error:", error);
          status.textContent = "Microphone error: " + error.message;
          stopRecording();
          startBtn.disabled = false;
        }
      }

      function stopRecording() {
        /*
         * AudioWorklet
         */
        if (workletNode) {
          workletNode.disconnect();
          workletNode = null;
        }
        /*
         * Zero-gain node
         */
        if (muteGain) {
          muteGain.disconnect();
          muteGain = null;
        }
        /*
         * Microphone source
         */
        if (source) {
          source.disconnect();
          source = null;
        }
        /*
         * AudioContext
         */
        if (audioContext) {
          audioContext.close();
          audioContext = null;
        }
        /*
         * Microphone stream
         */
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        /*
         * Socket.IO
         */
        if (socket) {
          socket.disconnect();
          socket = null;
        }
      }
    </script>
  </body>
</html>
